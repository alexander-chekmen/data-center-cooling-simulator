name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -q --durations=10

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start simulator (Modbus + control API)
        run: |
          nohup python -m sim.main > sim.log 2>&1 &
          echo $! > sim.pid

      - name: Start telemetry API (collector + dashboard)
        run: |
          nohup python -m api.main > api.log 2>&1 &
          echo $! > api.pid

      - name: Drive the full pipeline
        run: python scripts/smoke.py

      - name: Service logs
        if: always()
        run: |
          echo "===== simulator ====="; cat sim.log || true
          echo "===== telemetry ====="; cat api.log || true

      - name: Stop services
        if: always()
        run: |
          kill "$(cat sim.pid)" "$(cat api.pid)" 2>/dev/null || true
